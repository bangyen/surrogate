# Pin the toolchain so CI and local builds run the same compiler and the
# same clippy lint set.  A floating `stable` meant a new Rust release
# could fail a previously green build overnight with lints nobody could
# reproduce locally.  Bump this deliberately.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
