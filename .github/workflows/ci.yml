name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version, components and targets come from rust-toolchain.toml so
      # CI and local builds agree on the lint set.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Lint (Clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Verify explainability metrics
        # Re-measures against the committed model rather than re-reading
        # the report, so a regression in the model or trainer fails here.
        # A reduced sample keeps CI to a couple of minutes; the committed
        # baseline is generated at 300 positions and depth 12.
        run: |
          cargo run --release --bin chess-ai -- metrics --check \
            --n-positions 60 --depth 10

  wasm:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The pure core must keep compiling without the native feature, or
      # the browser demo silently breaks while every other check passes.
      - name: Build for wasm
        run: |
          cargo check --target wasm32-unknown-unknown \
            --no-default-features --features wasm --lib
